[package]
name = "trace-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trace-cli"
path = "src/main.rs"

[dependencies]
trace-core = { path = "../trace-core" }
trace-mcp = { path = "../trace-mcp" }
trace-parser = { path = "../trace-parser" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
